# Default configuration for the dark web OSINT collector.
# Every value here can also be overridden on the command line.
# Pass a different file with:  python scraper.py --config myconfig.ini ...

[tor]
# Local Tor SOCKS5 proxy. socks5h:// (used in code) resolves DNS through Tor too,
# which is required so .onion names resolve and no lookups leak to the local resolver.
socks_host = 127.0.0.1
socks_port = 9050

# Tor control port, used only to request a new circuit (NEWNYM). Requires
# "ControlPort 9051" plus a CookieAuthentication or HashedControlPassword in torrc.
control_port = 9051
# Leave blank to use cookie auth (or no auth). Set if you use HashedControlPassword.
control_password =

# Request a fresh Tor identity every N successful requests (0 disables rotation).
rotate_every = 25

[http]
# A Tor Browser-like UA is the conventional choice for blending in with onion traffic.
user_agent = Mozilla/5.0 (Windows NT 10.0; rv:115.0) Gecko/20100101 Firefox/115.0
# Per-request timeout in seconds (onion services are slow; be generous).
timeout = 60
# Retries per URL on transient/proxy/connection errors.
max_retries = 4
# Exponential backoff: sleep = min(backoff_cap, backoff_base ** attempt) + jitter.
backoff_base = 2.0
backoff_cap = 60
# Politeness: minimum seconds between two requests to the SAME host.
per_host_delay = 5.0
# Cap on downloaded bytes per page (defensive; avoids pathological responses).
max_bytes = 5242880

[crawl]
# Hard cap on pages fetched in one run (safety rail).
max_pages = 100
# How many link-hops from a seed to follow (0 = only the seeds themselves).
max_depth = 2
# Follow .onion links discovered on pages to expand the frontier.
expand_frontier = true
# If true, only follow links that stay on one of the seed hosts.
stay_on_seed_hosts = false

[evidence]
# Which optional evidence classes to gather. Each costs a connection or request
# beyond the page fetch itself, so the two that reach somewhere the page fetch
# did not go are OFF by default.

# Capture the TLS certificate on pages already fetched over https://. The
# handshake happens anyway, so this adds no contact with the service. A clearnet
# domain inside a hidden service's certificate is the single strongest passive
# attribution signal available.
capture_tls = true

# Also open port 443 on hosts only ever fetched over http://. This IS a new
# connection the operator did not serve us — opt in deliberately.
probe_tls_on_http = false

# Fetch each host's favicon (the <link rel=icon> target, else /favicon.ico) to
# compute its Shodan-compatible hash. One extra GET per host.
fetch_favicon = false

# Store page text as documents. Required for stylometry, temporal analysis and
# AI claim extraction; costs disk only.
store_documents = true

# Run the onion -> clearnet correlation pass automatically after a crawl. Pure
# local analysis over what was just collected; no network.
correlate_after_crawl = true
